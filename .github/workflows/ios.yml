name: Build IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-latest

    steps:
      - name: Set Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve packages (SFBAudioEngine)
        run: |
          xcodebuild -resolvePackageDependencies \
            -project SimplePlayer-iOS.xcodeproj \
            -scheme SimplePlayer

      - name: Build (device, unsigned)
        run: |
          xcodebuild build \
            -project SimplePlayer-iOS.xcodeproj \
            -scheme SimplePlayer \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Package IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "App: $APP"
          echo "Embedded frameworks:"
          ls "$APP/Frameworks" || echo "(none)"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry SimplePlayer.ipa Payload
          ls -lh SimplePlayer.ipa

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest SimplePlayer.ipa \
            --title "SimplePlayer (latest build)" \
            --notes "Unsigned IPA built from ${GITHUB_SHA::7}. Sign it with your sideloading tool." \
            --prerelease